<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Sign In</title>
	</head>
	<body>
		<h1>Sign In Page</h1>
		<form
			style="display: grid; grid-column: 2; width: 100px; gap: 2px"
			action=""
			method="post"
		>
			<label for="name">Name</label>
			<input type="text" id="name" name="u_name" />

			<label for="pwd">Type Password</label>
			<input type="password" name="u_pwd" id="pwd" />

			<button style="column-span: 2; margin-top: 5px" type="submit">
				Sign In
			</button>
		</form>
		<a href="/">Home</a>
	</body>
</html>
