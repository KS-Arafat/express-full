<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Sign Up</title>
	</head>
	<body>
		<h1>Sign Up Page</h1>
		<form
			action=""
			style="display: grid; grid-column: 2; width: 100px; gap: 2px"
			method="post"
		>
			<label for="name">Name</label>
			<input type="text" id="name" name="u_name" />

			<label for="email">Email</label>
			<input type="email" name="u_mail" id="email" />

			<label for="pwd">Type Password</label>
			<input type="password" name="u_pwd" id="pwd" />

			<button style="margin-top: 5px" type="submit">Sign Up</button>
		</form>
		<a href="/">Home</a>
	</body>
</html>
